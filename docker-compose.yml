version: '3.8'

services:
  # 1. THE BACKEND API CONTAINER
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: noise-backend
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
    volumes:
      # CRITICAL: This maps the folder holding your SQLite database inside the container
      # to a permanent folder on your AWS server hard drive so data is never lost on restarts!
      - backend-data:/app/Data
    restart: always

  # 2. THE FRONTEND HOLDING CONTAINER
  frontend:
    image: alpine:latest
    container_name: noise-frontend
    volumes:
      # We change this to a simple bind-mount that maps your built files straight to Nginx
      - ./frontend/build:/app/build
      - frontend-assets:/app/assets
    command: >
      sh -c "cp -r /app/build/. /app/assets/ && echo 'Frontend assets sync complete' && tail -f /dev/null"

volumes:
  backend-data:
  frontend-assets: