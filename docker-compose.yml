version: '3.8'

services:
  # 1. THE BACKEND API CONTAINER
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: noise-backend
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
    volumes:
      # CRITICAL: This maps the folder holding your SQLite database inside the container
      # to a permanent folder on your AWS server hard drive so data is never lost on restarts!
      - backend-data:/app/Data
    restart: always

  # 2. THE FRONTEND HOLDING CONTAINER
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: noise-frontend
    volumes:
      - frontend-assets:/var/www/frontend
    restart: "no" # This finishes instantly once files are copied into the volume

volumes:
  backend-data:
  frontend-assets: