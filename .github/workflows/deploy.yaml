name: Deploy Portfolio App to AWS

on:
  push:
    branches: [ main ] # Triggers every time you push code to main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # ─── FRONTEND BUILD ───
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Build React Frontend
      run: |
        cd frontend # Adjust to your actual folder name
        npm install
        npm run build

    # ─── BACKEND BUILD ───
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Publish .NET Backend
      run: |
        cd backend # Adjust to your actual folder name
        dotnet publish -c Release -o ./publish

    # ─── DEPLOY TO AWS VIA SSH ───
    - name: Copy Files to AWS Server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        # Copy the frontend build folder and compiled backend publish folder over
        source: "frontend/build/*,backend/publish/*"
        target: "/var/www/noise-site-temp"

    - name: Execute Server Deployment Scripts
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          # 1. Clean out the active production folders and move the fresh files in
          rm -rf /var/www/noise-site/frontend/*
          cp -r /var/www/noise-site-temp/frontend/build/* /var/www/noise-site/frontend/

          rm -rf /var/www/noise-site/backend/*
          cp -r /var/www/noise-site-temp/backend/publish/* /var/www/noise-site/backend/

          # 2. Clean up the temp folder
          rm -rf /var/www/noise-site-temp

          # 3. Force systemd to restart your backend to pick up the changes
          sudo systemctl restart dotnet-noise-site.service