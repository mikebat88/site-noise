name: deploy noise site app via docker to aws

on:
  push:
    branches: [ main ] # Triggers every time you push code to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Execute Remote Deployment Commands via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          # 1. Navigate to the deployment folder (we will create this in Step 2)
          cd /var/www/noise-site

          # 2. If the git repository isn't initialized on the server yet, clone it.
          # Otherwise, pull down the freshest changes from the main branch.
          if [ ! -d ".git" ]; then
            git clone https://github.com/${{ github.repository }}.git .
          else
            git fetch --all
            git reset --hard origin/main
          end

          # 3. Tell Docker Compose to build the fresh images and boot them up in the background (-d)
          # --build forces Docker to look for code changes and re-compile your .NET and React apps
          sudo docker-compose up --build -d

          # 4. Clean up any old, unused, dangling Docker layers to save precious SSD disk space
          sudo docker image prune -f